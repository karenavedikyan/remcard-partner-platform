<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Партнёры</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="pp-cabinet">
      <div class="pp-cabinet-top">
        <p class="pp-brand">remcard. <span>Партнёрский кабинет</span></p>
        <nav class="pp-main-nav" aria-label="Разделы кабинета">
          <a href="clients.html">Клиенты</a>
          <a href="index.html" aria-current="page">Партнёры</a>
        </nav>
      </div>
    </header>
    <div class="pp-shell">
      <div class="pp-demo-banner" role="note">
        <div><strong>Прототип</strong> · вымышленные данные. Не путать с рабочим сайтом.</div>
        <button type="button" class="pp-btn pp-btn--quiet" id="theme-toggle">Тёмная тема</button>
      </div>

      <div class="pp-toolbar">
        <h1>Партнёры</h1>
        <div class="pp-toolbar-controls">
          <div class="pp-view-toggle" role="group" aria-label="Вид списка">
            <button type="button" class="pp-btn" data-view-mode="list" aria-pressed="true">Список</button>
            <button type="button" class="pp-btn" data-view-mode="cards" aria-pressed="false">Карточки</button>
          </div>
        </div>
      </div>

      <p class="pp-viewer-line">
        Вы: <strong>Мария Орлова</strong>, специалист · Казань
      </p>

      <div id="partner-list" class="pp-list" data-view="list" aria-label="Активные партнёры"></div>
    </div>

    <dialog id="profile-dialog" class="pp-dialog" aria-labelledby="profile-dialog-title">
      <div class="pp-dialog-inner">
        <header class="pp-dialog-header">
          <button type="button" class="pp-btn pp-btn--quiet" id="profile-close">← Назад к списку</button>
          <h2 id="profile-dialog-title" style="margin: 0; font-size: var(--pp-sm); font-weight: 800">Профиль партнёра</h2>
        </header>
        <div class="pp-dialog-body">
          <div class="pp-perspective">
            <label for="perspective-select">Ракурс просмотра</label>
            <select id="perspective-select">
              <option value="cabinet">Профиль партнёра</option>
              <option value="reciprocal">Как партнёр видит мой профиль</option>
            </select>
          </div>
          <div id="profile-dialog-body"></div>
        </div>
      </div>
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
